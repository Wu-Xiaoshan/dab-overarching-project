services:
  database:
    container_name: dab-overarching-project-database-1
    image: postgres:17.0
    restart: unless-stopped
    env_file:
      - project.env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway
    command: -connectRetries=60 -baselineOnMigrate=true migrate
    volumes:
      - ./database-migrations:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://database:5432/database
      - FLYWAY_USER=username
      - FLYWAY_PASSWORD=password
    depends_on:
      database:
        condition: service_healthy

  redis:
    image: redis:alpine
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  lgtm:
    image: grafana/otel-lgtm:0.8.6
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4318:4318"
    volumes:
      - ./lgtm-data:/data

  traefik:
    image: traefik:v3.3
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:8000"
      - "--metrics.otlp=true"
      - "--metrics.otlp.http.endpoint=http://lgtm:4318/v1/metrics"
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on:
      lgtm:
        condition: service_started

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_started
      lgtm:
        condition: service_started
    env_file:
      - project.env
    environment:
      - POSTGRES_HOST=database
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server-router.entrypoints=web"
      - "traefik.http.routers.server-router.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.server-router.priority=50"
      - "traefik.http.routers.server-router.service=server-service"
      - "traefik.http.services.server-service.loadbalancer.server.port=8000"

  grader:
    build: ./grader
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - project.env
    environment:
      - POSTGRES_HOST=database
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grader-api.entrypoints=web"
      - "traefik.http.routers.grader-api.rule=PathPrefix(`/grader-api`)"
      - "traefik.http.routers.grader-api.priority=50"
      - "traefik.http.routers.grader-api.middlewares=grader-api-replacepath"
      - "traefik.http.middlewares.grader-api-replacepath.replacePathRegex.regex=^/grader-api(.*)"
      - "traefik.http.middlewares.grader-api-replacepath.replacePathRegex.replacement=/api$1"
      - "traefik.http.services.grader-api.loadbalancer.server.port=8000"

  inference-api:
    build: ./inference-api
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inference-api.entrypoints=web"
      - "traefik.http.routers.inference-api.rule=PathPrefix(`/inference-api`)"
      - "traefik.http.routers.inference-api.priority=100"
      - "traefik.http.routers.inference-api.middlewares=inference-api-stripprefix"
      - "traefik.http.routers.inference-api.service=inference-api-svc"
      - "traefik.http.middlewares.inference-api-stripprefix.replacePathRegex.regex=^/inference-api(.*)"
      - "traefik.http.middlewares.inference-api-stripprefix.replacePathRegex.replacement=$1"
      - "traefik.http.services.inference-api-svc.loadbalancer.server.port=8000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client-router.entrypoints=web"
      - "traefik.http.routers.client-router.rule=PathPrefix(`/`)"
      - "traefik.http.routers.client-router.priority=1"
      - "traefik.http.routers.client-router.service=client-service"
      - "traefik.http.services.client-service.loadbalancer.server.port=4321"
